<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Deep dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#020817"/>
      <stop offset="55%"  stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>

    <!-- Cyan neon glow -->
    <linearGradient id="cyan-line" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple accent -->
    <linearGradient id="purple-glow" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Text gradient: name -->
    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e2e8f0"/>
      <stop offset="60%"  stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cyan text highlight -->
    <linearGradient id="cyan-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#purple-glow)"/>

  <!-- ── Subtle dot grid ── -->
  <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#334155" fill-opacity="0.4"/>
  </pattern>
  <rect width="900" height="200" fill="url(#dot-grid)"/>

  <!-- ── Circuit / decoration lines ── -->
  <!-- top-left L -->
  <path d="M 0 0 L 60 0 L 60 35 L 90 35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="90" cy="35" r="3.5" fill="#38bdf8" fill-opacity="0.8" filter="url(#glow-soft)"/>
  <!-- bottom-right L -->
  <path d="M 900 200 L 840 200 L 840 165 L 810 165" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="810" cy="165" r="3.5" fill="#818cf8" fill-opacity="0.8" filter="url(#glow-soft)"/>
  <!-- mid horizontal dash -->
  <line x1="0" y1="108" x2="140" y2="108" stroke="#1e40af" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="760" y1="108" x2="900" y2="108" stroke="#1e40af" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ── Top + bottom cyan accent bars ── -->
  <rect x="0" y="0"   width="900" height="2.5" fill="url(#cyan-line)" opacity="0.9"/>
  <rect x="0" y="197" width="900" height="2.5" fill="url(#cyan-line)" opacity="0.7"/>

  <!-- ── Glowing side accent circles ── -->
  <circle cx="0"   cy="100" r="55" fill="#0ea5e9" fill-opacity="0.07"/>
  <circle cx="900" cy="100" r="55" fill="#7c3aed" fill-opacity="0.09"/>

  <!-- ── Avatar ring + chip icon ── -->
  <!-- outer ring -->
  <circle cx="110" cy="100" r="58" fill="none" stroke="url(#cyan-line)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <!-- inner filled circle (avatar bg) -->
  <circle cx="110" cy="100" r="46" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Chip/CPU icon inside -->
  <!-- chip body -->
  <rect x="86" y="76" width="48" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- chip pins left -->
  <line x1="80" y1="88"  x2="86" y2="88"  stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="80" y1="98"  x2="86" y2="98"  stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="80" y1="108" x2="86" y2="108" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="80" y1="118" x2="86" y2="118" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- chip pins right -->
  <line x1="134" y1="88"  x2="140" y2="88"  stroke="#818cf8" stroke-width="1.8"/>
  <line x1="134" y1="98"  x2="140" y2="98"  stroke="#818cf8" stroke-width="1.8"/>
  <line x1="134" y1="108" x2="140" y2="108" stroke="#818cf8" stroke-width="1.8"/>
  <line x1="134" y1="118" x2="140" y2="118" stroke="#818cf8" stroke-width="1.8"/>
  <!-- chip pins top -->
  <line x1="100" y1="70" x2="100" y2="76" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="110" y1="70" x2="110" y2="76" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="120" y1="70" x2="120" y2="76" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- chip pins bottom -->
  <line x1="100" y1="124" x2="100" y2="130" stroke="#818cf8" stroke-width="1.8"/>
  <line x1="110" y1="124" x2="110" y2="130" stroke="#818cf8" stroke-width="1.8"/>
  <line x1="120" y1="124" x2="120" y2="130" stroke="#818cf8" stroke-width="1.8"/>
  <!-- inner chip core -->
  <rect x="93" y="83" width="34" height="34" rx="3" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <!-- AI text on chip -->
  <text x="110" y="107" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="15" fill="url(#cyan-text)" filter="url(#glow-soft)">AI</text>

  <!-- ── Name ── -->
  <text x="190" y="78"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="700" font-size="34" letter-spacing="1"
        fill="url(#name-grad)" filter="url(#glow-soft)">MD Rakib Hassan Dipu</text>

  <!-- ── Role tag line ── -->
  <text x="192" y="108"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="400" font-size="14.5" letter-spacing="0.5"
        fill="#94a3b8">IoT &amp; Robotics Engineer · Edge AI Researcher · IEEE Published Author</text>

  <!-- ── Skill pill badges ── -->
  <!-- ESP32 -->
  <rect x="192" y="124" width="72" height="22" rx="11" fill="#0f3460" stroke="#38bdf8" stroke-width="0.9"/>
  <text x="228" y="139" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#38bdf8">⚡ ESP32</text>
  <!-- Machine Learning -->
  <rect x="272" y="124" width="110" height="22" rx="11" fill="#1a1040" stroke="#818cf8" stroke-width="0.9"/>
  <text x="327" y="139" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#818cf8">🧠 Machine Learning</text>
  <!-- ROS -->
  <rect x="390" y="124" width="58" height="22" rx="11" fill="#0c2e1a" stroke="#22c55e" stroke-width="0.9"/>
  <text x="419" y="139" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#22c55e">🤖 ROS</text>
  <!-- PCB Design -->
  <rect x="456" y="124" width="90" height="22" rx="11" fill="#2d1010" stroke="#f87171" stroke-width="0.9"/>
  <text x="501" y="139" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#f87171">🔌 PCB Design</text>
  <!-- IEEE -->
  <rect x="554" y="124" width="90" height="22" rx="11" fill="#1c1a00" stroke="#facc15" stroke-width="0.9"/>
  <text x="599" y="139" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#facc15">📝 IEEE Author</text>

  <!-- ── Vertical separator ── -->
  <line x1="176" y1="55" x2="176" y2="155" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

  <!-- ── Corner tick marks ── -->
  <path d="M 18 18 L 18 0 L 0 0"   fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 882 18 L 882 0 L 900 0" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 18 182 L 18 200 L 0 200"   fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 882 182 L 882 200 L 900 200" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>