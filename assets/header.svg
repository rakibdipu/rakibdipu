<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <linearGradient id="tech-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(121, 40, 202, 0.9)); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(240px); }
    }
    @keyframes float-dot {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Ubuntu, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: #ffffff;
      animation: pulse-glow 4s ease-in-out infinite;
    }
    .sub-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Ubuntu, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 1.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .floating {
      animation: float-dot 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Cyber Grid Overlay -->
  <rect width="900" height="240" rx="16" fill="url(#cyber-grid)" />

  <!-- Circuit Lines & Decorative Geometric Accents -->
  <!-- Top-left circuit -->
  <path d="M 30 50 L 100 50 L 130 20 L 220 20" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="220" cy="20" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="30" cy="50" r="3" fill="#00f2fe"/>

  <!-- Top-right circuit -->
  <path d="M 870 50 L 800 50 L 770 20 L 680 20" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="680" cy="20" r="3.5" fill="#FF0080" filter="url(#glow)"/>
  <circle cx="870" cy="50" r="3" fill="#7928CA"/>

  <!-- Bottom wave & divider -->
  <path d="M 50 185 L 350 185 L 375 205 L 850 205" fill="none" stroke="url(#tech-line)" stroke-width="2"/>
  <circle cx="375" cy="205" r="4" fill="#00f2fe" class="floating"/>

  <!-- Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
  <path d="M 880 40 L 880 20 L 860 20" fill="none" stroke="#FF0080" stroke-width="2.5"/>
  <path d="M 20 200 L 20 220 L 40 220" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
  <path d="M 880 200 L 880 220 L 860 220" fill="none" stroke="#FF0080" stroke-width="2.5"/>

  <!-- Robot / AI Icon Vector -->
  <g transform="translate(70, 75)" filter="url(#glow)">
    <circle cx="35" cy="35" r="32" fill="#111c2e" stroke="#00f2fe" stroke-width="2" />
    <path d="M 23 28 Q 35 20 47 28 Q 47 42 35 48 Q 23 42 23 28 Z" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="30" cy="32" r="2.5" fill="#00f2fe"/>
    <circle cx="40" cy="32" r="2.5" fill="#00f2fe"/>
    <path d="M 31 40 Q 35 43 39 40" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 35 20 L 35 12" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="35" cy="10" r="2.5" fill="#FF0080"/>
  </g>

  <!-- Main Name Heading -->
  <text x="160" y="98" class="title-text">
    MD RAKIB HASSAN DIPU
  </text>

  <!-- Subtitle -->
  <text x="162" y="126" class="sub-text">
    IoT &amp; Robotics Engineer  •  AI &amp; Embedded Systems Specialist
  </text>

  <!-- Mini Tag Badges Inside Banner -->
  <g transform="translate(162, 142)">
    <!-- Badge 1: IoT & Hardware -->
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#0c2340" stroke="#00f2fe" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" fill="#38bdf8" class="badge-text">⚡ IoT &amp; EMBEDDED</text>

    <!-- Badge 2: Edge AI -->
    <rect x="145" y="0" width="125" height="24" rx="12" fill="#24123a" stroke="#a855f7" stroke-width="1"/>
    <text x="207" y="16" text-anchor="middle" fill="#c084fc" class="badge-text">🧠 EDGE AI / ML</text>

    <!-- Badge 3: Robotics & ROS -->
    <rect x="280" y="0" width="135" height="24" rx="12" fill="#13241b" stroke="#22c55e" stroke-width="1"/>
    <text x="347" y="16" text-anchor="middle" fill="#4ade80" class="badge-text">🤖 ROBOTICS &amp; ROS</text>

    <!-- Badge 4: IEEE Author -->
    <rect x="425" y="0" width="145" height="24" rx="12" fill="#2d141e" stroke="#f43f5e" stroke-width="1"/>
    <text x="497" y="16" text-anchor="middle" fill="#fb7185" class="badge-text">📝 IEEE RAAICON '25</text>
  </g>

  <!-- Right Decorative Pulse Nodes -->
  <g transform="translate(770, 75)">
    <circle cx="40" cy="40" r="28" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="40" cy="40" r="18" fill="#1e1035" stroke="#FF0080" stroke-width="1.5"/>
    <text x="40" y="44" text-anchor="middle" fill="#FF0080" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">AI</text>
  </g>
</svg>