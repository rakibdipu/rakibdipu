<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210">
  <defs>
    <!-- Background Gradient: Deep Obsidian Void -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ambient Glow Left: Electric Cyan -->
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Glow Right: Deep Indigo -->
    <radialGradient id="glowRight" cx="85%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Core Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Hex Icon Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#475569" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ── Background Fill ── -->
  <rect width="920" height="210" fill="url(#bgGrad)"/>
  <rect width="920" height="210" fill="url(#glowLeft)"/>
  <rect width="920" height="210" fill="url(#glowRight)"/>
  <rect width="920" height="210" fill="url(#gridPattern)"/>

  <!-- ── Precision Edge Bars ── -->
  <rect x="0" y="0" width="920" height="2" fill="url(#lineGrad)"/>
  <rect x="0" y="208" width="920" height="2" fill="url(#lineGrad)" opacity="0.65"/>

  <!-- ── Cybernetic Circuit Wave Traces ── -->
  <path d="M 0 50 L 70 50 L 95 75 L 145 75" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="145" cy="75" r="3" fill="#38bdf8" fill-opacity="0.8" filter="url(#softGlow)"/>

  <path d="M 0 160 L 50 160 L 75 135 L 120 135" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35"/>
  <circle cx="120" cy="135" r="2.5" fill="#818cf8" fill-opacity="0.7"/>

  <path d="M 920 60 L 850 60 L 825 85 L 780 85" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="780" cy="85" r="3" fill="#818cf8" fill-opacity="0.8" filter="url(#softGlow)"/>

  <path d="M 920 150 L 870 150 L 845 125 L 805 125" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"/>
  <circle cx="805" cy="125" r="2.5" fill="#38bdf8" fill-opacity="0.7"/>

  <!-- ── Hardware MCU Hex Core Emblem (Left) ── -->
  <g transform="translate(105, 105)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
    <!-- Outer Hexagon -->
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="url(#hexGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#softGlow)"/>
    <!-- Inner Hexagon -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#090d16" stroke="#475569" stroke-width="1"/>
    
    <!-- Microcontroller Chip Symbol -->
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Chip Pins -->
    <line x1="-21" y1="-8" x2="-16" y2="-8" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-21" y1="0"  x2="-16" y2="0"  stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-21" y1="8"  x2="-16" y2="8"  stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="16"  y1="-8" x2="21"  y2="-8" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="16"  y1="0"  x2="21"  y2="0"  stroke="#818cf8" stroke-width="1.5"/>
    <line x1="16"  y1="8"  x2="21"  y2="8"  stroke="#818cf8" stroke-width="1.5"/>
    <line x1="-8" y1="-21" x2="-8" y2="-16" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0"  y1="-21" x2="0"  y2="-16" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="8"  y1="-21" x2="8"  y2="-16" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-8" y1="16"  x2="-8" y2="21"  stroke="#818cf8" stroke-width="1.5"/>
    <line x1="0"  y1="16"  x2="0"  y2="21"  stroke="#818cf8" stroke-width="1.5"/>
    <line x1="8"  y1="16"  x2="8"  y2="21"  stroke="#818cf8" stroke-width="1.5"/>
    <!-- Core CPU Node Core Pulse -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <!-- ── Vertical Divider ── -->
  <line x1="184" y1="46" x2="184" y2="164" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ── Main Typography: Name ── -->
  <text x="208" y="74"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
        font-weight="800" font-size="34" letter-spacing="0.5"
        fill="url(#nameGrad)" filter="url(#textGlow)">
    MD Rakib Hassan Dipu
  </text>

  <!-- ── Engineering Subtitle ── -->
  <text x="210" y="104"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
        font-weight="600" font-size="14.5" letter-spacing="1.2"
        fill="url(#subGrad)">
    EMBEDDED SYSTEMS  ·  AUTONOMOUS ROBOTICS  ·  EDGE INTELLIGENCE
  </text>

  <!-- ── Technical Pillar Badges (Sleek Glassmorphic Pills) ── -->
  <g transform="translate(208, 126)">
    <!-- 1. FreeRTOS & C++ -->
    <rect x="0" y="0" width="124" height="26" rx="6" fill="#0c1e38" stroke="#0284c7" stroke-width="1" stroke-opacity="0.7"/>
    <text x="62" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#38bdf8">⚡ FreeRTOS / C++</text>

    <!-- 2. ESP32-S3 / Firmware -->
    <rect x="134" y="0" width="138" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" stroke-opacity="0.8"/>
    <text x="203" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#94a3b8">⚙️ ESP32-S3 Firmware</text>

    <!-- 3. Sensor Fusion & DSP -->
    <rect x="282" y="0" width="144" height="26" rx="6" fill="#18133a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="354" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#a5b4fc">📡 Sensor Fusion / DSP</text>

    <!-- 4. ROS Robotics -->
    <rect x="436" y="0" width="112" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1" stroke-opacity="0.7"/>
    <text x="492" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#34d399">🤖 ROS Robotics</text>

    <!-- 5. PCB Design -->
    <rect x="558" y="0" width="108" height="26" rx="6" fill="#25163a" stroke="#9333ea" stroke-width="1" stroke-opacity="0.7"/>
    <text x="612" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#c084fc">🔌 PCB Design</text>
  </g>

  <!-- ── Technical Scope Tagline ── -->
  <text x="210" y="180"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="400" font-size="12" letter-spacing="0.4"
        fill="#64748b">
    Engineering physical hardware, real-time control loops, and on-device machine learning from schematic to deployment.
  </text>

  <!-- ── High-Precision Corner Accents ── -->
  <path d="M 16 16 L 16 4 L 4 4"   fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 904 16 L 904 4 L 916 4" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 16 194 L 16 206 L 4 206" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 904 194 L 904 206 L 916 206" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
</svg>